name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint and formatting check with Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Static type checking with Mypy
        run: |
          mypy entangle_tensor

      - name: Run Test Suites with Pytest
        run: |
          pytest -v --durations=10

      - name: Execute Numerical Examples
        run: |
          python examples/dmrg_heisenberg.py
          python examples/quantum_quench_tebd.py
          python examples/cft_central_charge.py
